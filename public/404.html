<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting… | Gian Carlo Noriega</title>
    <!-- Single-page site: bounce unknown URLs back to the root, keeping any #hash -->
    <script>
      (function () {
        var siteRoot = '/Portfolio-Rework/'
        window.location.replace(window.location.origin + siteRoot + window.location.hash)
      })()
    </script>
    <meta http-equiv="refresh" content="0; url=/Portfolio-Rework/" />
  </head>
  <body style="background:#07090c;color:#f4f6f8;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0">
    <p>Redirecting you to the portfolio… <a style="color:#39c5df" href="/Portfolio-Rework/">Click here if nothing happens.</a></p>
  </body>
</html>
